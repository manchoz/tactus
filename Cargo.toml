[workspace]
resolver = "2"
members = [
    "crates/tactus-protocol",
    "crates/tactus-link-sys",
    "crates/tactus-sync-core",
    "crates/tactusd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

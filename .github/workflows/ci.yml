name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    name: Format, Clippy, Test & Script Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install host build and lint dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake shellcheck

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Check embedded Web UI JavaScript syntax
        run: node --check crates/tactusd/web/app.js

      - name: Check provisioning script syntax and lint
        run: |
          bash -n system/scripts/provision-debian.sh system/scripts/provision-factory-unoq.sh system/scripts/flash-mcu-unoq.sh system/scripts/deploy-tactusd.sh system/scripts/build-unoq-kernel-local.sh system/kernel/build.sh
          shellcheck system/scripts/*.sh system/kernel/*.sh

  cross-aarch64:
    name: Cross-Compile aarch64-unknown-linux-gnu Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain with aarch64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install ARM64 cross-compilation toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake

      - name: Build release binaries for aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        run: cargo build --workspace --release --target aarch64-unknown-linux-gnu

name: Build UNO Q 5 GHz Kernel (.deb)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: Linux kernel git repository
        required: true
        default: https://github.com/arduino/linux-qcom
        type: string
      kernel_ref:
        description: Linux kernel git branch or tag
        required: true
        default: qcom-v7.2.11-arduino
        type: string
      deb_images_repo:
        description: Arduino Debian images repository
        required: true
        default: https://github.com/arduino/arduino-deb-images
        type: string
      deb_images_ref:
        description: Arduino Debian images git branch or tag
        required: true
        default: arduino
        type: string
  workflow_call:
    inputs:
      kernel_repo:
        description: Linux kernel git repository
        required: false
        default: https://github.com/arduino/linux-qcom
        type: string
      kernel_ref:
        description: Linux kernel git branch or tag
        required: false
        default: qcom-v7.2.11-arduino
        type: string
      deb_images_repo:
        description: Arduino Debian images repository
        required: false
        default: https://github.com/arduino/arduino-deb-images
        type: string
      deb_images_ref:
        description: Arduino Debian images git branch or tag
        required: false
        default: arduino
        type: string

permissions:
  contents: read

jobs:
  build-unoq-kernel:
    name: Build arm64 Kernel Debian Package
    runs-on: ubuntu-latest
    container: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Tactus repository
        uses: actions/checkout@v4

      - name: Install Debian arm64 kernel cross-build dependencies
        run: |
          set -euo pipefail
          dpkg --add-architecture arm64
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            build-essential \
            crossbuild-essential-arm64 \
            make \
            flex \
            bison \
            bc \
            libdw-dev \
            libelf-dev \
            libssl-dev \
            libssl-dev:arm64 \
            dpkg-dev \
            debhelper \
            kmod \
            python3 \
            rsync \
            coreutils \
            cpio \
            xz-utils

      - name: Build UNO Q 5 GHz kernel .deb
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo || 'https://github.com/arduino/linux-qcom' }}
          KERNEL_REF: ${{ inputs.kernel_ref || 'qcom-v7.2.11-arduino' }}
          DEB_IMAGES_REPO: ${{ inputs.deb_images_repo || 'https://github.com/arduino/arduino-deb-images' }}
          DEB_IMAGES_REF: ${{ inputs.deb_images_ref || 'arduino' }}
        run: |
          bash system/kernel/build.sh
          ls -lh ./*.deb ./*.changes

      - name: Upload kernel .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unoq-kernel-5ghz-deb
          path: |
            linux-image-*.deb
            !linux-image-*-dbg_*.deb
            *.changes
            linux/.config
          if-no-files-found: error

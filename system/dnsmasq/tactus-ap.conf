# Dedicated DHCP-only server for Tactus WiFi AP (10.42.0.1/24).
# Omitting default router (option 3) and DNS (option 6) prevents iOS/Android
# Captive Portal prompts and keeps cellular data usable (SPEC.md §4).
port=0
interface=wlan0
bind-dynamic
listen-address=10.42.0.1
dhcp-range=10.42.0.50,10.42.0.150,255.255.255.0,12h
dhcp-option=3
dhcp-option=6
dhcp-leasefile=/run/tactus/dnsmasq.leases
pid-file=/run/tactus/dnsmasq.pid
no-resolv
no-poll

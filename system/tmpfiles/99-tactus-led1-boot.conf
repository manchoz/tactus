# Blink UNO Q Linux LED1 blue during early boot until tactus-ap + tactusd take over.
w- /sys/class/leds/unoq:user-red1/trigger - - - - none
w- /sys/class/leds/unoq:user-red1/brightness - - - - 0
w- /sys/class/leds/unoq:user-green1/trigger - - - - none
w- /sys/class/leds/unoq:user-green1/brightness - - - - 0
w- /sys/class/leds/unoq:user-blue1/trigger - - - - timer

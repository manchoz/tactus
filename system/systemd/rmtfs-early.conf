# Start Qualcomm rmtfs as soon as its shared-memory device and modemst
# partition symlinks appear instead of waiting for local-fs/basic.target.
[Unit]
DefaultDependencies=no
Requires=dev-qcom_rmtfs_mem1.device
Wants=dev-disk-by\x2dpartlabel-modemst1.device dev-disk-by\x2dpartlabel-modemst2.device dev-disk-by\x2dpartlabel-wlanaddr.device
After=systemd-remount-fs.service dev-qcom_rmtfs_mem1.device dev-disk-by\x2dpartlabel-modemst1.device dev-disk-by\x2dpartlabel-modemst2.device dev-disk-by\x2dpartlabel-wlanaddr.device
Conflicts=shutdown.target
Before=shutdown.target NetworkManager.service

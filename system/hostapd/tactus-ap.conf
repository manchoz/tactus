# Tactus Dedicated WiFi Access Point (portable 1:1 Debian SBC / Yocto meta-tactus)
# Defaults to 2.4 GHz channel 11 (2462 MHz, 20 MHz, clear of BLE advertising
# channels 2402/2426/2480 MHz) for broad Linux SBC radio compatibility.
# On radios supporting 5 GHz AP mode, switch to `hw_mode=a`, `channel=36`,
# `ieee80211ac=1`, `vht_oper_chwidth=0` if desired.
interface=wlan0
driver=nl80211

ssid=Tactus
country_code=IT
ieee80211d=1

hw_mode=g
channel=11

# Low-latency WiFi tuning for Ableton Link UDP multicast & mobile peers
wmm_enabled=1
ieee80211n=1
beacon_int=100
dtim_period=1
multicast_to_unicast=1
ap_isolate=0

# WPA2-PSK (CCMP)
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=tactus-link

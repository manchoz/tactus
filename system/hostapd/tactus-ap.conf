# Tactus Dedicated WiFi Access Point — 5 GHz (default)
# 5 GHz non-DFS channel 36 (5180 MHz, 20 MHz VHT) keeps Ableton Link UDP multicast
# and mobile peers off the 2.4 GHz band shared with BLE-MIDI. Requires a kernel that
# clears NO-IR on 5 GHz for the radio (UNO Q: system/kernel/tactus-5ghz.config).
# tactus-ap.service falls back to tactus-ap-2g.conf automatically when channel 36 is
# still NO-IR (for example on the stock UNO Q kernel).
interface=wlan0
driver=nl80211

ssid=Tactus
country_code=IT
ieee80211d=1

hw_mode=a
channel=36

# Low-latency WiFi tuning for Ableton Link UDP multicast & mobile peers
wmm_enabled=1
ieee80211n=1
ieee80211ac=1
vht_oper_chwidth=0
vht_oper_centr_freq_seg0_idx=0
beacon_int=100
dtim_period=1
multicast_to_unicast=1
ap_isolate=0

# WPA2-PSK (CCMP)
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=tactus-link

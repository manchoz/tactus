# Tactus Dedicated WiFi Access Point — 2.4 GHz fallback
# Used by tactus-ap.service when 5 GHz channel 36 is NO-IR (stock kernel / radios that
# cannot beacon on 5 GHz). 2.4 GHz channel 11 (2462 MHz, 20 MHz) is clear of the BLE
# advertising channels (2402/2426/2480 MHz) and works on any Linux SBC radio.
interface=wlan0
driver=nl80211

ssid=Tactus
country_code=IT
ieee80211d=1

hw_mode=g
channel=11

# Low-latency WiFi tuning for Ableton Link UDP multicast & mobile peers
wmm_enabled=1
ieee80211n=1
beacon_int=100
dtim_period=1
multicast_to_unicast=1
ap_isolate=0

# WPA2-PSK (CCMP)
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=tactus-link

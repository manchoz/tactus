# Portable OpenOCD linuxgpiod SWD adapter configuration for Arduino UNO Q (STM32U585).

adapter driver linuxgpiod

adapter gpio srst 38 -chip 1
adapter gpio swclk 26 -chip 1
adapter gpio swdio 25 -chip 1
adapter gpio trst 38 -chip 1

transport select swd
source [find target/stm32u5x.cfg]

# linuxgpiod does not implement configurable bitbang speeds; clear the stock
# stm32x5x reset-start `adapter speed 480` call so reset/halt succeeds cleanly.
stm32u5x.cpu configure -event reset-start {}

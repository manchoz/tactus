<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360">
  <defs>
    <radialGradient id="bBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#181f2c"/>
      <stop offset="60%" stop-color="#10141c"/>
      <stop offset="100%" stop-color="#0d0f14"/>
    </radialGradient>
    <radialGradient id="bIconBg" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#181e2a"/>
      <stop offset="100%" stop-color="#0f131b"/>
    </radialGradient>
    <radialGradient id="bAmberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.56"/>
      <stop offset="48%" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bAmberCore" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#e58e08"/>
    </radialGradient>
    <linearGradient id="bTealArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="bWhiteArc" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="bPhase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eef2f7" stop-opacity="0"/>
      <stop offset="22%" stop-color="#eef2f7" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="78%" stop-color="#2dd4bf" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <pattern id="bGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.3" fill="#2c374c" opacity="0.6"/>
    </pattern>
    <radialGradient id="bVignette" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#0d0f14" stop-opacity="0"/>
      <stop offset="70%" stop-color="#0d0f14" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0d0f14" stop-opacity="0.92"/>
    </radialGradient>
    <clipPath id="bClip">
      <rect x="1" y="1" width="1278" height="358" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bClip)">
    <rect width="1280" height="360" fill="url(#bBg)"/>
    <rect width="1280" height="360" fill="url(#bGrid)"/>
    <rect width="1280" height="360" fill="url(#bVignette)"/>

    <!-- Subtle horizontal clock-pulse axis & symmetric 4-beat ticks -->
    <line x1="60" y1="146" x2="1220" y2="146" stroke="url(#bPhase)" stroke-width="1.5" opacity="0.38"/>
    <g opacity="0.52">
      <rect x="132" y="134" width="4" height="24" rx="2" fill="#eef2f7"/>
      <rect x="164" y="139" width="4" height="14" rx="2" fill="#eef2f7" opacity="0.55"/>
      <rect x="196" y="139" width="4" height="14" rx="2" fill="#eef2f7" opacity="0.55"/>
      <rect x="228" y="139" width="4" height="14" rx="2" fill="#eef2f7" opacity="0.55"/>
      <rect x="260" y="131" width="4" height="30" rx="2" fill="#f59e0b" opacity="0.95"/>

      <rect x="1016" y="131" width="4" height="30" rx="2" fill="#2dd4bf" opacity="0.95"/>
      <rect x="1048" y="139" width="4" height="14" rx="2" fill="#2dd4bf" opacity="0.55"/>
      <rect x="1080" y="139" width="4" height="14" rx="2" fill="#2dd4bf" opacity="0.55"/>
      <rect x="1112" y="139" width="4" height="14" rx="2" fill="#2dd4bf" opacity="0.55"/>
      <rect x="1144" y="134" width="4" height="24" rx="2" fill="#2dd4bf"/>
    </g>

    <!-- Centered Brand Lockup: Precision Dial Icon + tac•tus -->
    <g transform="translate(425, 84)">
      <rect x="0" y="6" width="112" height="112" rx="26" fill="url(#bIconBg)" stroke="#263042" stroke-width="2"/>
      <circle cx="56" cy="62" r="40.4" fill="none" stroke="#232a38" stroke-width="1.2" stroke-dasharray="2.5 5"/>
      <circle cx="56" cy="62" r="18" fill="none" stroke="#232a38" stroke-width="1.5"/>
      <path d="M 31.02 44.51 A 30.5 30.5 0 0 1 84.65 51.57" fill="none" stroke="url(#bTealArc)" stroke-width="8" stroke-linecap="round"/>
      <circle cx="86.2" cy="66.24" r="4.2" fill="#2dd4bf"/>
      <path d="M 80.98 79.49 A 30.5 30.5 0 0 1 27.35 72.43" fill="none" stroke="url(#bWhiteArc)" stroke-width="8" stroke-linecap="round"/>
      <circle cx="25.8" cy="57.76" r="4.2" fill="#eef2f7"/>
      <circle cx="56" cy="62" r="22.4" fill="url(#bAmberGlow)"/>
      <circle cx="56" cy="62" r="9.6" fill="url(#bAmberCore)"/>

      <!-- Wordmark -->
      <text x="140" y="88" fill="#eef2f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif" font-size="88" font-weight="700" letter-spacing="-2.5">tac</text>
      <circle cx="283" cy="62" r="24" fill="url(#bAmberGlow)"/>
      <circle cx="283" cy="62" r="9.5" fill="url(#bAmberCore)"/>
      <text x="304" y="88" fill="#eef2f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif" font-size="88" font-weight="700" letter-spacing="-2.5">tus</text>
    </g>

    <!-- Centered Tagline -->
    <text x="640" y="246" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Helvetica Neue', sans-serif" font-size="22" font-weight="500" letter-spacing="0.4">
      MIDI Clock Hardware Bridge for Ableton Link
    </text>

    <!-- Centered Spec Pills -->
    <g transform="translate(384, 276)">
      <rect x="0" y="0" width="136" height="32" rx="16" fill="#2dd4bf" fill-opacity="0.14" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="1"/>
      <text x="68" y="20.5" text-anchor="middle" fill="#2dd4bf" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="700" letter-spacing="1.1">LINK &#x2194; MIDI</text>

      <rect x="148" y="0" width="102" height="32" rx="16" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="1"/>
      <text x="199" y="20.5" text-anchor="middle" fill="#f59e0b" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="700" letter-spacing="1.1">24 PPQN</text>

      <rect x="262" y="0" width="112" height="32" rx="16" fill="#151922" stroke="#2b3549" stroke-width="1"/>
      <text x="318" y="20.5" text-anchor="middle" fill="#eef2f7" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="700" letter-spacing="1.1">WIFI AP</text>

      <rect x="386" y="0" width="126" height="32" rx="16" fill="#151922" stroke="#2b3549" stroke-width="1"/>
      <text x="449" y="20.5" text-anchor="middle" fill="#8b96ab" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="700" letter-spacing="1.1">8&#xD7; MIDI OUT</text>
    </g>

    <rect x="0" y="356" width="1280" height="4" fill="url(#bPhase)"/>
  </g>

  <rect x="1" y="1" width="1278" height="358" rx="22" fill="none" stroke="#232a38" stroke-width="2"/>
</svg>

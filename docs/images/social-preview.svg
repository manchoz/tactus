<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <radialGradient id="sBg" cx="50%" cy="44%" r="68%">
      <stop offset="0%" stop-color="#19202e"/>
      <stop offset="58%" stop-color="#10141c"/>
      <stop offset="100%" stop-color="#0d0f14"/>
    </radialGradient>
    <radialGradient id="sIconBg" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#181e2a"/>
      <stop offset="100%" stop-color="#0f131b"/>
    </radialGradient>
    <radialGradient id="sAmberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.58"/>
      <stop offset="48%" stop-color="#f59e0b" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sAmberCore" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#e58e08"/>
    </radialGradient>
    <linearGradient id="sTealArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="sWhiteArc" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="sPhase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eef2f7" stop-opacity="0"/>
      <stop offset="22%" stop-color="#eef2f7" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="78%" stop-color="#2dd4bf" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <pattern id="sGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.5" fill="#2c374c" opacity="0.62"/>
    </pattern>
    <radialGradient id="sVignette" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0d0f14" stop-opacity="0"/>
      <stop offset="68%" stop-color="#0d0f14" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0d0f14" stop-opacity="0.92"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed dark obsidian social card -->
  <rect width="1280" height="640" fill="url(#sBg)"/>
  <rect width="1280" height="640" fill="url(#sGrid)"/>
  <rect width="1280" height="640" fill="url(#sVignette)"/>

  <!-- Subtle inset technical frame -->
  <rect x="28" y="28" width="1224" height="584" rx="26" fill="none" stroke="#232a38" stroke-width="2"/>

  <!-- Subtle horizontal clock-pulse axis & symmetric 4-beat ticks -->
  <line x1="72" y1="262" x2="1208" y2="262" stroke="url(#sPhase)" stroke-width="2" opacity="0.36"/>
  <g opacity="0.54">
    <rect x="118" y="246" width="5" height="32" rx="2.5" fill="#eef2f7"/>
    <rect x="154" y="253" width="5" height="18" rx="2.5" fill="#eef2f7" opacity="0.55"/>
    <rect x="190" y="253" width="5" height="18" rx="2.5" fill="#eef2f7" opacity="0.55"/>
    <rect x="226" y="253" width="5" height="18" rx="2.5" fill="#eef2f7" opacity="0.55"/>
    <rect x="262" y="242" width="5" height="40" rx="2.5" fill="#f59e0b" opacity="0.95"/>

    <rect x="1013" y="242" width="5" height="40" rx="2.5" fill="#2dd4bf" opacity="0.95"/>
    <rect x="1049" y="253" width="5" height="18" rx="2.5" fill="#2dd4bf" opacity="0.55"/>
    <rect x="1085" y="253" width="5" height="18" rx="2.5" fill="#2dd4bf" opacity="0.55"/>
    <rect x="1121" y="253" width="5" height="18" rx="2.5" fill="#2dd4bf" opacity="0.55"/>
    <rect x="1157" y="246" width="5" height="32" rx="2.5" fill="#2dd4bf"/>
  </g>

  <!-- Centered Hero Lockup: Large Precision Dial Icon + tac•tus -->
  <g transform="translate(362, 180)">
    <rect x="0" y="6" width="152" height="152" rx="34" fill="url(#sIconBg)" stroke="#263042" stroke-width="2.5"/>
    <circle cx="76" cy="82" r="54.8" fill="none" stroke="#232a38" stroke-width="1.6" stroke-dasharray="3 6.5"/>
    <circle cx="76" cy="82" r="24.5" fill="none" stroke="#232a38" stroke-width="2"/>
    <path d="M 42.1 58.26 A 41.4 41.4 0 0 1 114.9 67.84" fill="none" stroke="url(#sTealArc)" stroke-width="11" stroke-linecap="round"/>
    <circle cx="117" cy="87.76" r="5.7" fill="#2dd4bf"/>
    <path d="M 109.9 105.74 A 41.4 41.4 0 0 1 37.1 96.16" fill="none" stroke="url(#sWhiteArc)" stroke-width="11" stroke-linecap="round"/>
    <circle cx="35" cy="76.24" r="5.7" fill="#eef2f7"/>
    <circle cx="76" cy="82" r="30.5" fill="url(#sAmberGlow)"/>
    <circle cx="76" cy="82" r="13.1" fill="url(#sAmberCore)"/>

    <text x="190" y="118" fill="#eef2f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif" font-size="116" font-weight="700" letter-spacing="-3.2">tac</text>
    <circle cx="378" cy="82" r="32" fill="url(#sAmberGlow)"/>
    <circle cx="378" cy="82" r="12.5" fill="url(#sAmberCore)"/>
    <text x="406" y="118" fill="#eef2f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif" font-size="116" font-weight="700" letter-spacing="-3.2">tus</text>
  </g>

  <!-- Tagline -->
  <text x="640" y="408" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Helvetica Neue', sans-serif" font-size="30" font-weight="500" letter-spacing="0.4">
    MIDI Clock Hardware Bridge for Ableton Link
  </text>

  <!-- Spec Pills -->
  <g transform="translate(310, 456)">
    <rect x="0" y="0" width="176" height="42" rx="21" fill="#2dd4bf" fill-opacity="0.14" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="1.4"/>
    <text x="88" y="26.5" text-anchor="middle" fill="#2dd4bf" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" font-weight="700" letter-spacing="1.3">LINK &#x2194; MIDI</text>

    <rect x="192" y="0" width="132" height="42" rx="21" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="1.4"/>
    <text x="258" y="26.5" text-anchor="middle" fill="#f59e0b" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" font-weight="700" letter-spacing="1.3">24 PPQN</text>

    <rect x="340" y="0" width="144" height="42" rx="21" fill="#151922" stroke="#2b3549" stroke-width="1.4"/>
    <text x="412" y="26.5" text-anchor="middle" fill="#eef2f7" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" font-weight="700" letter-spacing="1.3">WIFI AP</text>

    <rect x="500" y="0" width="160" height="42" rx="21" fill="#151922" stroke="#2b3549" stroke-width="1.4"/>
    <text x="580" y="26.5" text-anchor="middle" fill="#8b96ab" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" font-weight="700" letter-spacing="1.3">8&#xD7; MIDI OUT</text>
  </g>

  <!-- Top & bottom accent bars -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#sPhase)" opacity="0.7"/>
  <rect x="0" y="636" width="1280" height="4" fill="url(#sPhase)"/>
</svg>
